# 12 人群英乱斗局：把四个新角色一次性放进同一副板子，用来做压力测试
# ——狼队有狼王(枪)+机械狼(查神)，好人有通灵师(查死人)+舞者(封技能)+假面(抗推)。
# 只有 3 个平民，屠民线很短，狼队节奏快，对模型的信息整合能力要求最高。
name = "12人群英乱斗局(狼王机械狼 VS 通灵舞者假面)"
seats = 12

[roles]
"狼人" = 2
"狼王" = 1
"机械狼" = 1
"预言家" = 1
"女巫" = 1
"通灵师" = 1
"舞者" = 1
"假面" = 1
"平民" = 3

[rules]
victory = "屠边"
witch_self_save_day = 1
witch_sees_kill = "always"
witch_same_night_both = false
wolf_king_shoot_on_poison = false
mechanic_wolf_shares = true
psychic_reveals_role = true
dancer_repeat = false
dancer_feedback = true
mask_exile_immunity = 1
mask_loses_vote = true
first_night_last_words = true
night_death_last_words = false
tie_rule = "revote"
max_days = 10
